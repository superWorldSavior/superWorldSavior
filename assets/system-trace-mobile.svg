<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Systems that let agents do real work</title>
  <desc id="desc">A dark violet and cyan trace connecting a series of system nodes.</desc>

  <defs>
    <linearGradient id="background-mobile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020" />
      <stop offset="0.55" stop-color="#171129" />
      <stop offset="1" stop-color="#07151b" />
    </linearGradient>
    <linearGradient id="trace-mobile" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6" />
      <stop offset="0.52" stop-color="#c084fc" />
      <stop offset="1" stop-color="#22d3ee" />
    </linearGradient>
    <radialGradient id="violet-mobile" cx="0.08" cy="0.12" r="0.9">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cyan-mobile" cx="0.9" cy="0.86" r="0.62">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22" />
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid-mobile" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />
    </pattern>
    <filter id="glow-mobile" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="720" height="360" rx="24" fill="url(#background-mobile)" />
  <rect width="720" height="360" rx="24" fill="url(#violet-mobile)" />
  <rect width="720" height="360" rx="24" fill="url(#cyan-mobile)" />
  <rect width="720" height="360" rx="24" fill="url(#grid-mobile)" />

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="44" y="88" fill="#c4b5fd" font-size="18" font-weight="700" letter-spacing="3.2">ERWAN LEE PESLE</text>
    <text x="44" y="151" fill="#f8fafc" font-size="46" font-weight="650" letter-spacing="-0.8">Systems that let agents</text>
    <text x="44" y="204" fill="#f8fafc" font-size="46" font-weight="650" letter-spacing="-0.8">do real work.</text>
  </g>

  <g>
    <path d="M48 287 C142 221 219 229 294 271 S451 328 672 248" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="17" stroke-linecap="round" />
    <path d="M48 287 C142 221 219 229 294 271 S451 328 672 248" fill="none" stroke="url(#trace-mobile)" stroke-width="4" stroke-linecap="round" />
    <g filter="url(#glow-mobile)">
      <circle cx="48" cy="287" r="8" fill="#8b5cf6" />
      <circle cx="190" cy="242" r="8" fill="#a78bfa" />
      <circle cx="326" cy="286" r="8" fill="#c084fc" />
      <circle cx="494" cy="296" r="8" fill="#67e8f9" />
      <circle cx="672" cy="248" r="9" fill="#22d3ee" />
    </g>
  </g>

  <rect x="0.75" y="0.75" width="718.5" height="358.5" rx="23.25" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1.5" />
</svg>
